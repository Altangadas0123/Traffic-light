<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>traffic light</title>
</head>
<body>
    <div class="container">
        <div class="red" style="--color: rgb(53, 33, 33); --shadow: 0px 0px 20px red, 0px 0px 40px red, inset 0px 0px 20px red;">
            <div class="human-r" style="--human-color: red;"></div>
        </div>
        <div class="yellow" style="--color: rgb(69, 69, 41); --shadow: 0px 0px 20px yellow, 0px 0px 40px yellow, inset 0px 0px 20px yellow;">
            <div class="human-y" style="--human-color: yellow;"></div>
        </div>
        <div class="green" style="--color: rgb(38, 70, 38); --shadow: 0px 0px 20px green, 0px 0px 40px green, inset 0px 0px 20px green;">
            <div class="human-g" style="--human-color: green;"></div>
        </div>
    </div>
</body>
</html>
